[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safepaste"
version = "0.1.0"
description = "Local PII review before text is pasted into a public AI assistant"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0.0", "presidio-analyzer>=2.2.0"]

[project.optional-dependencies]
ml = ["gliner>=0.2.24", "protobuf>=4.25.0"]
data = ["datasets>=3.0.0"]

[project.scripts]
safepaste = "safepaste.cli:main"
safepaste-web = "safepaste.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safepaste = ["static/*.html"]
